name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      should-run: ${{ steps.gate.outputs.should-run }}
    steps:
      - run: sleep 90
      - id: gate
        continue-on-error: true
        run: echo "should-run=true" >> "$GITHUB_OUTPUT"
  test:
    needs: gate
    if: ${{ !cancelled() && needs.gate.result != 'skipped' && needs.gate.outputs.should-run != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GATE_RESULT: ${{ needs.gate.result }}
          SHOULD_RUN: ${{ needs.gate.outputs.should-run }}
        run: echo "needs.gate.result=$GATE_RESULT should-run=[$SHOULD_RUN]"


name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
jobs:
  gate:
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "action=${{ github.event.action }}"
          echo 'changes=${{ toJSON(github.event.changes) }}'
          echo 'stack=${{ toJSON(github.event.pull_request.stack) }}'
  test:
    needs: gate
    if: ${{ !cancelled() && needs.gate.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: if [ -f fail.txt ]; then echo "fail.txt present"; exit 1; fi

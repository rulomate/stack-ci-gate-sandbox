name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - run: echo "event=${{ github.event_name }} sha=${{ github.sha }}"
  test:
    needs: gate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: if [ -f fail.txt ] && [ "$GITHUB_EVENT_NAME" = pull_request ]; then echo "fail.txt present"; exit 1; fi

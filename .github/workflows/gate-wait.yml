name: Gate wait
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should-run: ${{ steps.gate.outputs.should-run }}
    steps:
      - id: gate
        uses: raulgg/stack-ci-gate@48ae7c249a6d5ab9f590b25fdc5c9ef4aacf4b70
        continue-on-error: true
      - name: Show gate outputs
        env:
          SHOULD_RUN: ${{ steps.gate.outputs.should-run }}
          IS_STACKED: ${{ steps.gate.outputs.is-stacked }}
          POSITION: ${{ steps.gate.outputs.position }}
          SIZE: ${{ steps.gate.outputs.size }}
          IS_BOTTOM: ${{ steps.gate.outputs.is-bottom }}
          IS_TOP: ${{ steps.gate.outputs.is-top }}
        run: echo "gate-outputs should-run=$SHOULD_RUN is-stacked=$IS_STACKED position=$POSITION size=$SIZE is-bottom=$IS_BOTTOM is-top=$IS_TOP"
  gated:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.should-run != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo gated work

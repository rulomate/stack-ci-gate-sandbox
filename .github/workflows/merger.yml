name: Merger
on:
  pull_request:
    types: [opened, reopened, synchronize]
permissions:
  contents: write
  pull-requests: write
jobs:
  merge-bottom:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET: "27"
    steps:
      - uses: actions/checkout@v4
      - run: gh extension install github/gh-stack
      - run: gh pr view "$TARGET" --json mergeStateStatus,mergeable,baseRefName
      - run: GH_DEBUG=api gh stack merge "$TARGET" --yes --squash 2>&1 | grep -vi "authorization"
      - if: always()
        run: sleep 20; gh pr view "$TARGET" --json state,mergedBy,mergeCommit

name: Retarget
on:
  pull_request:
    types: [edited]
permissions: {}
jobs:
  rerun-ci:
    # Only base changes, and only for branches in this repository.
    if: github.event.changes.base != null && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
